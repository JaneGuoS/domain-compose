const CTX_GROUPS=[
  {name:'Content Authoring',color:'#dbeafe',border:'#2563eb',bg:'#eff6ff',keys:['file','version','folder','content','approval','expir','custom','workflo','library','preview','tag','linked','micro','import']},
  {name:'Publishing',color:'#dcfce7',border:'#16a34a',bg:'#f0fdf4',keys:['publish','channel','shortcut','share','distribut']},
  {name:'Workspace & Identity',color:'#f3e8ff',border:'#7c3aed',bg:'#faf5ff',keys:['team','workspace','permission','user','auth','site','profile']},
  {name:'Analytics',color:'#fef9c3',border:'#ca8a04',bg:'#fefce8',keys:['analytic','report','activity','statistic','metric']},
  {name:'External Systems',color:'#fee2e2',border:'#dc2626',bg:'#fef2f2',keys:['google','blob','storage','virus','bss','cache','vfs','node','external','azure','cdn']},
];

// Assigns each domain to a context group by keyword-matching domain id
function groupByContext(domains,editedTargets){
  const buckets=CTX_GROUPS.map(g=>({...g,domains:[]}));
  const overflow={...CTX_GROUPS[0],domains:[]};// fallback → Content Authoring
  domains.forEach(d=>{
    const id=d.id.toLowerCase();
    const t=editedTargets?editedTargets[d.id]||d.dddTarget:d.dddTarget;
    if(!t?.aggregate||t.aggregate.includes('not found')||t.aggregate.includes('Delegated'))return;
    const b=buckets.find(b=>b.keys.some(k=>id.includes(k)))||buckets[0];
    b.domains.push(d);
  });
  return buckets.filter(b=>b.domains.length>0);
}

// ── CONTEXT MAP SVG ────────────────────────────────────
function ContextMapSvg({data,editedTargets}){
  const GROUPS=CTX_GROUPS;
  // ── Layout: 5 zones with clear separation ──────────────
  // Canvas: 820 × 650  Legend strip at bottom (y=620)
  //
  //   [Workspace & Identity — top centre]
  //         ↓
  //   [Content Authoring   ]    [Publishing    ]
  //   [  left, tall        ]    [right top      ]
  //                             [Analytics      ]
  //                             [right bottom   ]
  //         ↓
  //        [External Systems — bottom centre]
  //
  const BOX={
    'Content Authoring':    {x:20,  y:126, w:258, h:300},
    'Publishing':           {x:552, y:106, w:218, h:185},
    'Workspace & Identity': {x:296, y:10,  w:210, h:100},
    'Analytics':            {x:552, y:308, w:218, h:168},
    'External Systems':     {x:212, y:488, w:238, h:112},
  };
  // ARROWS: pick clean entry/exit points to avoid box overlap
  // Using explicit path coordinates instead of midpoint to keep labels away from boxes
  const W=820,H=650;
  const MCLR={'am-p':'#7c3aed','am-g':'#059669','am-b':'#2563eb'};
  const edge=(b,dx,dy)=>{
    const cx=b.x+b.w/2,cy=b.y+b.h/2;
    if(!dx&&!dy)return{x:cx,y:cy};
    const tx=(b.w/2)/Math.abs(dx)||1e9,ty=(b.h/2)/Math.abs(dy)||1e9;
    const t=Math.min(tx,ty);
    return{x:cx+dx*t,y:cy+dy*t};
  };
  const aline=(fn,tn,lxOff,lyOff)=>{
    const fb=BOX[fn],tb=BOX[tn];if(!fb||!tb)return null;
    const fcx=fb.x+fb.w/2,fcy=fb.y+fb.h/2,tcx=tb.x+tb.w/2,tcy=tb.y+tb.h/2;
    const dx=tcx-fcx,dy=tcy-fcy,len=Math.sqrt(dx*dx+dy*dy)||1;
    const s=edge(fb,dx/len,dy/len),e=edge(tb,-dx/len,-dy/len);
    // label position: midpoint shifted by optional offset to avoid box overlap
    const lx=(s.x+e.x)/2+(lxOff||0),ly=(s.y+e.y)/2+(lyOff||0);
    return{x1:s.x,y1:s.y,x2:e.x,y2:e.y,lx,ly};
  };
  // Assign aggregates to groups
  const gmap={};GROUPS.forEach(g=>gmap[g.name]=[]);
  data.domains.filter(d=>{const t=editedTargets[d.id]||d.dddTarget;return t?.aggregate&&!t.aggregate.includes('not found')&&!t.aggregate.includes('Delegated');})
    .forEach(d=>{
      const id=d.id.toLowerCase();
      const t=editedTargets[d.id]||d.dddTarget;
      const g=GROUPS.find(g=>g.keys.some(k=>id.includes(k)))||GROUPS[0];
      gmap[g.name].push(t.aggregate);
    });

  // Arrow definitions: [from, to, label, color, dashed, markerId, labelXOffset, labelYOffset]
  const ARROWS=[
    {f:'Workspace & Identity',t:'Content Authoring', label:'access guard',      color:'#7c3aed',dashed:false,mid:'am-p', lx: 0, ly:-12},
    {f:'Content Authoring',   t:'Publishing',        label:'content-event',     color:'#059669',dashed:true, mid:'am-g', lx: 0, ly:-12},
    {f:'Content Authoring',   t:'Analytics',         label:'data-collection',   color:'#059669',dashed:true, mid:'am-g', lx: 0, ly: 14},
    {f:'Content Authoring',   t:'External Systems',  label:'blob / VFS (HTTP)', color:'#2563eb',dashed:false,mid:'am-b', lx: 62, ly:  0},
  ];

  const LEGEND_Y=H-26;
  return h('svg',{viewBox:`0 0 ${W} ${H}`,width:'100%',style:{display:'block',fontFamily:'inherit',background:'#fafbff',borderRadius:10}},
    // Marker defs
    h('defs',null,[
      ...['am-p','am-g','am-b'].map(id=>h('marker',{key:id,id,markerWidth:8,markerHeight:8,refX:7,refY:3,orient:'auto'},
        h('path',{d:'M0,0 L0,6 L8,3 z',fill:MCLR[id]})
      )),
      h('filter',{id:'lbl-shadow',x:'-5%',y:'-20%',width:'110%',height:'140%'},
        h('feDropShadow',{dx:0,dy:1,stdDeviation:1,floodColor:'#000',floodOpacity:0.06})
      )
    ]),
    // Legend strip background
    h('rect',{x:0,y:LEGEND_Y-10,width:W,height:36,fill:'#f1f3f8',rx:0}),
    // Context boxes
    GROUPS.map(g=>{
      const b=BOX[g.name];if(!b)return null;
      const aggs=gmap[g.name]||[];
      const maxShow=Math.floor((b.h-36)/18);
      return h('g',{key:g.name},
        h('rect',{x:b.x,y:b.y,width:b.w,height:b.h,rx:12,fill:g.color,stroke:g.border,strokeWidth:1.8}),
        // Context name badge
        h('rect',{x:b.x+8,y:b.y+7,width:b.w-16,height:18,rx:5,fill:g.border,opacity:0.15}),
        h('text',{x:b.x+14,y:b.y+20,fontSize:10,fontWeight:700,fill:g.border},g.name),
        // Aggregate list
        ...aggs.slice(0,maxShow).map((agg,i)=>h('text',{key:i,x:b.x+16,y:b.y+36+i*18,fontSize:9,fill:'#374151'},
          '• '+(agg.length>28?agg.slice(0,26)+'…':agg)
        )),
        aggs.length>maxShow&&h('text',{x:b.x+16,y:b.y+36+maxShow*18,fontSize:9,fill:'#94a3b8'},`+${aggs.length-maxShow} more`),
        aggs.length===0&&h('text',{x:b.x+16,y:b.y+46,fontSize:9,fill:'#94a3b8',fontStyle:'italic'},'no aggregates assigned')
      );
    }),
    // Arrows (drawn after boxes so labels sit on top)
    ARROWS.map((arr,i)=>{
      const pts=aline(arr.f,arr.t,arr.lx,arr.ly);if(!pts)return null;
      const lblW=arr.label.length*5.2+14;
      return h('g',{key:i},
        h('line',{x1:pts.x1,y1:pts.y1,x2:pts.x2,y2:pts.y2,
          stroke:arr.color,strokeWidth:1.8,
          strokeDasharray:arr.dashed?'6,3':undefined,
          markerEnd:`url(#${arr.mid})`}),
        // Label pill — background then text
        h('rect',{x:pts.lx-lblW/2,y:pts.ly-8,width:lblW,height:15,rx:5,
          fill:'#fff',stroke:arr.color,strokeWidth:0.8,filter:'url(#lbl-shadow)'}),
        h('text',{x:pts.lx,y:pts.ly+4,fontSize:8,fill:arr.color,textAnchor:'middle',fontWeight:600},arr.label)
      );
    }),
    // Legend
    h('g',{transform:`translate(14,${LEGEND_Y})`},
      h('line',{x1:0,y1:5,x2:18,y2:5,stroke:'#059669',strokeWidth:1.8,strokeDasharray:'6,3',markerEnd:'url(#am-g)'}),
      h('text',{x:22,y:9,fontSize:8,fill:'#64748b'},'Async event (Kafka)'),
      h('line',{x1:150,y1:5,x2:168,y2:5,stroke:'#2563eb',strokeWidth:1.8,markerEnd:'url(#am-b)'}),
      h('text',{x:172,y:9,fontSize:8,fill:'#64748b'},'HTTP / sync call'),
      h('line',{x1:268,y1:5,x2:286,y2:5,stroke:'#7c3aed',strokeWidth:1.8,markerEnd:'url(#am-p)'}),
      h('text',{x:290,y:9,fontSize:8,fill:'#64748b'},'Access guard'),
      h('text',{x:390,y:9,fontSize:8,fill:'#94a3b8',fontStyle:'italic'},'⚠ Run relationship-analysis skill for verified arrows')
    )
  );
}

// ── GAP ANALYSIS ───────────────────────────────────────
const CAT_CLS={
  'Layer violation':'layer','Anemic model':'anemic','Missing concept':'missing',
  'Infra coupling':'infra','Layer':'layer','Anemic':'anemic'
};
function GapAnalysis({gaps,workflows}){
  // Derive gaps from workflow violations if no explicit gapAnalysis
  const derived=gaps||(workflows||[]).flatMap((wf,wi)=>
    (wf.steps||[]).filter(s=>s.type==='violation').map((s,si)=>({
      id:`${wi}-${si}`,title:s.label,detail:`In workflow: ${wf.name}`,
      file:'',severity:'P0',category:'Layer violation'
    }))
  );
  if(!derived.length)return h('div',{className:'empty'},'No violations found — domain model looks healthy.');

  const counts={P0:derived.filter(g=>g.severity==='P0').length,P1:derived.filter(g=>g.severity==='P1').length,P2:derived.filter(g=>g.severity==='P2').length};
  const catCls=cat=>{const k=Object.keys(CAT_CLS).find(k=>cat.toLowerCase().includes(k.toLowerCase()));return CAT_CLS[k]||'layer';};

  return h('div',null,
    h('div',{className:'gap-summary'},
      counts.P0>0&&h('span',{className:'gap-chip p0'},`🔴 ${counts.P0} P0 — Fundamental`),
      counts.P1>0&&h('span',{className:'gap-chip p1'},`🟡 ${counts.P1} P1 — Structural`),
      counts.P2>0&&h('span',{className:'gap-chip p2'},`🟢 ${counts.P2} P2 — Improvement`)
    ),
    h('table',{className:'gap-table'},
      h('thead',null,h('tr',null,
        h('th',null,'#'),h('th',null,'Violation'),h('th',null,'Detail'),
        h('th',null,'File'),h('th',null,'Sev'),h('th',null,'Category')
      )),
      h('tbody',null,derived.map((g,i)=>h('tr',{key:g.id||i},
        h('td',null,g.id||i+1),
        h('td',null,h('strong',null,g.title)),
        h('td',{style:{color:'#5B6F8A',maxWidth:260}},g.detail),
        h('td',null,g.file?h('code',{style:{fontSize:10,background:'#F4F7FC',padding:'1px 5px',borderRadius:3,fontFamily:'monospace'}},g.file):'—'),
        h('td',null,h('span',{className:`sev ${g.severity}`},
          g.severity==='P0'?'🔴 P0':g.severity==='P1'?'🟡 P1':'🟢 P2'
        )),
        h('td',null,h('span',{className:`cat-pill ${catCls(g.category)}`},g.category))
      )))
    )
  );
}

// ── ANALYZE PANEL ─────────────────────────────────────
function AnalyzePanel({onClose,onDone}){
  const[mode,setMode]=useState('url'); // 'url' | 'local'
  const[url,setUrl]=useState('');
  const[dir,setDir]=useState('');
  const[out,setOut]=useState('');
  const[maxDomains,setMaxDomains]=useState(0); // 0 = no limit
  const[pickedFiles,setPickedFiles]=useState(null);
  const[folderName,setFolderName]=useState('');
  const[jobId,setJobId]=useState(null);
  const[status,setStatus]=useState('idle');
  const[logs,setLogs]=useState([]);
  const[service,setService]=useState('');
  const[err,setErr]=useState(null);
  const logRef=useRef(null);
  const fileInputRef=useRef(null);

  useEffect(()=>{if(logRef.current)logRef.current.scrollTop=logRef.current.scrollHeight;},[logs]);

  useEffect(()=>{
    if(!jobId||status!=='running')return;
    const iv=setInterval(async()=>{
      try{
        const r=await fetch(`${API}/api/jobs/${jobId}`);
        const d=await r.json();
        setLogs(d.logs||[]);
        if(d.status==='done'){setStatus('done');setService(d.service);clearInterval(iv);}
        else if(d.status==='error'){setStatus('error');setErr(d.error||'Analysis failed');clearInterval(iv);}
      }catch{setStatus('error');setErr('Lost connection');clearInterval(iv);}
    },800);
    return()=>clearInterval(iv);
  },[jobId,status]);

  const onFilesPicked=e=>{
    const all=[...e.target.files].filter(f=>f.name.endsWith('.cs'));
    if(!all.length)return;
    const folder=all[0].webkitRelativePath.split('/')[0];
    setPickedFiles(all);
    setFolderName(folder);
    setDir('');
    if(!out)setOut(folder);
  };

  const clearPick=()=>{
    setPickedFiles(null);setFolderName('');
    if(fileInputRef.current)fileInputRef.current.value='';
  };

  const canSubmit=status!=='running'&&(mode==='url'?url.trim():(pickedFiles||dir.trim()));

  const resetForm=()=>{setStatus('idle');setLogs([]);setErr(null);setJobId(null);};
  const switchMode=m=>{setMode(m);resetForm();};

  const submit=async e=>{
    e.preventDefault();
    if(!canSubmit)return;
    setStatus('running');setLogs([]);setErr(null);

    if(mode==='url'){
      // GitHub URL mode: POST to /api/discover
      const r=await fetch(`${API}/api/discover`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({url:url.trim(),out:out.trim()||undefined,maxDomains:maxDomains||undefined})});
      const d=await r.json();
      if(!r.ok){setStatus('error');setErr(d.error);return;}
      setJobId(d.jobId);setService(d.service);
    } else if(pickedFiles){
      // Folder picker upload mode
      setLogs([`📂 Reading ${pickedFiles.length} .cs files from "${folderName}"…`]);
      const fileData=await Promise.all(pickedFiles.map(async f=>({path:f.webkitRelativePath,content:await f.text()})));
      setLogs(l=>[...l,`⬆️  Uploading ${fileData.length} files…`]);
      const r=await fetch(`${API}/api/analyze-upload`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({out:out.trim()||folderName,files:fileData})});
      const d=await r.json();
      if(!r.ok){setStatus('error');setErr(d.error);return;}
      setJobId(d.jobId);setService(d.service);
    } else {
      // Manual path mode
      const r=await fetch(`${API}/api/jobs`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({dir:dir.trim(),out:out.trim()||undefined,maxDomains:maxDomains||undefined})});
      const d=await r.json();
      if(!r.ok){setStatus('error');setErr(d.error);return;}
      setJobId(d.jobId);setService(d.service);
    }
  };

  return h('div',{className:'ap-overlay',onClick:e=>{if(e.target===e.currentTarget)onClose();}},
    h('div',{className:'ap-panel'},
      h('div',{className:'ap-hdr'},
        h('span',{className:'ap-title'},'🔍 Analyze a Service Repo'),
        h('button',{className:'ap-close',onClick:onClose},'✕')
      ),
      h('form',{className:'ap-form',onSubmit:submit},

        // Mode toggle
        h('div',{className:'ap-mode'},
          h('button',{type:'button',className:`ap-mode-btn url${mode==='url'?' active':''}`,onClick:()=>switchMode('url')},'🔗 GitHub URL'),
          h('button',{type:'button',className:`ap-mode-btn${mode==='local'?' active':''}`,onClick:()=>switchMode('local')},'📁 Local directory')
        ),

        // Hidden folder input (local mode)
        h('input',{type:'file',ref:fileInputRef,style:{display:'none'},webkitdirectory:'',directory:'',multiple:true,onChange:onFilesPicked}),

        // GitHub URL mode
        mode==='url'&&h('label',{className:'ap-label'},'GitHub repository URL',
          h('input',{className:'ap-input',placeholder:'https://github.com/seismic/channel-service',value:url,onChange:e=>setUrl(e.target.value),disabled:status==='running',autoFocus:true}),
          h('span',{className:'ap-hint'},'Clones the repo and runs a full DDD analysis — requires gh auth')
        ),

        // Local directory mode
        mode==='local'&&h('label',{className:'ap-label'},'Repo directory',
          pickedFiles
            ?h('div',null,
                h('div',{className:'ap-folder-tag'},
                  '📁 ',h('span',null,folderName),
                  h('span',{style:{color:'#6B7280',marginLeft:4}},`(${pickedFiles.length} .cs files)`),
                  h('button',{type:'button',onClick:clearPick,title:'Clear'},'✕')
                )
              )
            :h('div',{className:'ap-path-row'},
                h('input',{className:'ap-input',placeholder:'/path/to/service-repo',value:dir,onChange:e=>setDir(e.target.value),disabled:status==='running'}),
                h('button',{type:'button',className:'ap-pick-btn',disabled:status==='running',onClick:()=>fileInputRef.current?.click()},'📁 Browse')
              )
        ),

        h('label',{className:'ap-label'},
          h('span',null,'Output name ',h('span',{className:'ap-optional'},'(optional)')),
          h('input',{className:'ap-input',placeholder:`defaults to ${mode==='url'?'repo name':'folder name'}`,value:out,onChange:e=>setOut(e.target.value),disabled:status==='running'})
        ),

        // Domain count control
        h('div',{style:{display:'flex',flexDirection:'column',gap:4}},
          h('span',{style:{fontSize:12,fontWeight:600,color:'#5B6F8A'}},
            'Analysis depth',
            h('span',{style:{fontWeight:400,color:'#9AA7B4',marginLeft:4}},
              maxDomains>0?`— ${maxDomains} domains max`:'— auto (Claude decides)')
          ),
          h('div',{style:{display:'flex',gap:6,flexWrap:'wrap'}},
            [{label:'Auto',val:0,hint:'Let Claude decide (typically 6–12)'},{label:'High-level',val:5,hint:'5 broad domains — fast overview'},{label:'Standard',val:10,hint:'10 domains — balanced detail'},{label:'Granular',val:20,hint:'20 domains — fine-grained'}]
              .map(opt=>h('button',{
                key:opt.val,type:'button',
                title:opt.hint,
                disabled:status==='running',
                onClick:()=>setMaxDomains(opt.val),
                style:{
                  padding:'4px 12px',borderRadius:6,fontSize:12,fontWeight:600,cursor:'pointer',
                  border:'1.5px solid '+(maxDomains===opt.val?'#F15A24':'#D0DCF0'),
                  background:maxDomains===opt.val?'#FFF0E8':'#F8F9FA',
                  color:maxDomains===opt.val?'#C04A1A':'#5B6F8A',
                  transition:'all .15s',
                }
              },opt.label))
          )
        ),

        h('button',{className:'ap-submit',type:'submit',disabled:!canSubmit},
          status==='running'?'⏳ Analyzing…':mode==='url'?'Analyze from URL':'Run Analysis')
      ),

      (logs.length>0||status!=='idle')&&h('div',{className:'ap-log-wrap'},
        h('div',{className:'ap-log-title'},
          status==='running'&&h('span',{className:'ap-pulse'}),
          status==='running'?'Running…':status==='done'?'✅ Done':'❌ Failed'
        ),
        h('div',{className:'ap-log',ref:logRef},
          ...logs.map((line,i)=>h('div',{key:i,className:'ap-log-line'},line)),
          status==='running'&&h('div',{className:'ap-log-cursor'},'▌')
        )
      ),
      status==='error'&&err&&h('div',{className:'ap-error'},'⚠ ',err),
      status==='done'&&h('div',{className:'ap-done'},
        h('span',null,'Service ',h('code',null,service),' is ready.'),
        h('button',{className:'ap-load-btn',onClick:()=>{onDone(service);onClose();}},'Load into Studio →')
      )
    )
  );
}

// ── APP ───────────────────────────────────────────────
function App(){
  const[services,setServices]=useState([]);
  const[activeSvc,setActiveSvc]=useState('');
  const[data,setData]=useState(null);
  const[impact,setImpact]=useState(null);
  const[selDomain,setSelDomain]=useState(null);
  const[selAgg,setSelAgg]=useState(null);
  const[selWf,setSelWf]=useState(null);
  const[view,setView]=useState('current'); // 'current' | 'ddd' | 'gap'
  const[loading,setLoading]=useState(true);
  const[showAnalyze,setShowAnalyze]=useState(false);
  const[editedTargets,setEditedTargets]=useState({});
  const[ctxMapStatus,setCtxMapStatus]=useState('idle'); // 'idle' | 'generating' | 'ready'
  const[impactLoading,setImpactLoading]=useState(false);
  const[editDomain,setEditDomain]=useState(null); // domain object or null (modal, add only)
  const[isNewDomain,setIsNewDomain]=useState(false);
  const[isNewDddDomain,setIsNewDddDomain]=useState(null);
  const[editingId,setEditingId]=useState(null); // inline card edit
  const[toasts,setToasts]=useState([]);
  const loadingFor=useRef('');

  const showToast=(msg,type='success')=>{
    const id=Date.now();
    setToasts(t=>[...t,{id,msg,type}]);
    setTimeout(()=>setToasts(t=>t.filter(x=>x.id!==id)),3000);
  };

  const loadService=async name=>{
    loadingFor.current=name;
    setActiveSvc(name);
    setData(null);
    setLoading(true);setImpact(null);setSelDomain(null);setSelAgg(null);setSelWf(null);setEditedTargets({});setCtxMapStatus('idle');setEditingId(null);
    const r=await fetch(`${API}/api/analyze/${name}`);
    const json=await r.json();
    if(loadingFor.current!==name)return;
    setData(json);
    setLoading(false);
  };

  const refreshServices=async()=>{
    const r=await fetch(`${API}/api/services`);
    const list=await r.json();
    setServices(list);
    return list;
  };

  useEffect(()=>{
    refreshServices().then(list=>{
      if(list.length>0)loadService(list[0]);
      else setLoading(false);
    }).catch(()=>setLoading(false));
  },[]);

  const handleImpact=async req=>{
    if(!req.trim()||!activeSvc){setImpact(null);window._impactEngine=null;return;}
    setImpactLoading(true);
    try{
      const r=await fetch(`${API}/api/impact`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({service:activeSvc,requirement:req})});
      const d=await r.json();
      window._impactEngine=d.engine||null;
      setImpact(d);
    }finally{
      setImpactLoading(false);
    }
  };

  const handleAnalyzeDone=async svc=>{
    const list=await refreshServices();
    loadService(list.includes(svc)?svc:list[0]);
  };

  const handleSaveDomain=async patch=>{
    if(!activeSvc)return;
    const url=isNewDomain
      ?`${API}/api/services/${activeSvc}/domains`
      :`${API}/api/services/${activeSvc}/domains/${patch.id}`;
    const r=await fetch(url,{method:isNewDomain?'POST':'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify(patch)});
    if(r.ok){
      setData(await r.json());
      showToast(isNewDomain?`✅ Domain "${patch.name}" added`:`✅ "${patch.name}" saved`);
    } else {
      showToast('❌ Failed to save changes','danger');
    }
    setEditDomain(null);setIsNewDomain(false);
  };

  const handleSaveDddDomain=async patch=>{
    if(!activeSvc)return;
    const r=await fetch(`${API}/api/services/${activeSvc}/domains`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(patch)});
    if(r.ok){
      setData(await r.json());
      showToast(`✅ Domain "${patch.name}" added`);
    } else {
      showToast('❌ Failed to save changes','danger');
    }
    setIsNewDddDomain(null);
  };

  const handleDeleteDomain=async domainId=>{
    if(!activeSvc)return;
    const name=data.domains.find(d=>d.id===domainId)?.name||domainId;
    const r=await fetch(`${API}/api/services/${activeSvc}/domains/${domainId}`,{method:'DELETE'});
    if(r.ok){
      setData(await r.json());
      showToast(`🗑 "${name}" removed`,'danger');
    } else {
      showToast('❌ Failed to remove domain','danger');
    }
    setEditDomain(null);
  };

  if(loading&&!data)return h('div',{className:'loading'},h('div',{className:'spinner'}),h('p',null,'Loading service…'));
  if(!data&&!loading)return h('div',null,
    h('div',{className:'loading'},
      h('p',null,'No services found.'),
      h('button',{className:'analyze-btn',style:{marginTop:16},onClick:()=>setShowAnalyze(true)},'+ Analyze a service repo')
    ),
    showAnalyze&&h(AnalyzePanel,{onClose:()=>setShowAnalyze(false),onDone:handleAnalyzeDone})
  );

  const counts=impact&&data?{
    direct:data.domains.filter(d=>impact.domainScores[d.id]?.level==='direct').length,
    indirect:data.domains.filter(d=>impact.domainScores[d.id]?.level==='indirect').length,
    none:data.domains.filter(d=>(impact.domainScores[d.id]?.level??'none')==='none').length
  }:null;

  const selectedDomain=selDomain?data.domains.find(d=>d.id===selDomain):null;

  // Derive violations: explicit gapAnalysis field OR from workflow violation steps
  const gaps=data?.gapAnalysis||(data?.workflows||[]).flatMap((wf,wi)=>
    (wf.steps||[]).filter(s=>s.type==='violation').map((s,si)=>({
      id:`${wi}-${si}`,title:s.label,detail:`In workflow: ${wf.name}`,
      file:'',severity:'P0',category:'Layer violation'
    }))
  );
  const p0Count=gaps.filter(g=>g.severity==='P0').length;
  const totalViolations=gaps.filter(g=>g.severity!=='P2').length;

  // Domain card violation map: domainId → highest severity
  const domainViolations={};
  (data?.gapAnalysis||[]).forEach(g=>{
    // match violation to domain by keyword
    data.domains.forEach(d=>{
      if(g.file&&g.file.toLowerCase().includes(d.name.replace(/ /g,'').toLowerCase().slice(0,6))){
        const cur=domainViolations[d.id];
        if(!cur||(g.severity==='P0'&&cur!=='P0')||(g.severity==='P1'&&cur==='P2'))
          domainViolations[d.id]=g.severity;
      }
    });
  });

  return h('div',null,
    // Header
    h('header',{className:'hdr'},
      h('div',{className:'hdr-l'},
        h('div',{className:'logo-s'},'S'),
        h('span',{className:'logo-txt'},'DomainCompose Studio'),
        services.length>1&&h('select',{className:'svc-select',value:activeSvc,onChange:e=>loadService(e.target.value)},
          services.map(s=>h('option',{key:s,value:s},s))
        ),
        services.length===1&&h('span',{className:'svc-badge'},activeSvc)
      ),
      h('div',{className:'view-toggle'},
        h('button',{className:`vt-btn${view==='current'?' active':''}`,onClick:()=>setView('current')},'📄 Domain Map'),
        h('button',{className:`vt-btn refactor${view==='ddd'?' active':''}`,onClick:()=>setView('ddd')},'🔷 DDD Target'),
        h('button',{className:`vt-btn gap${view==='gap'?' active':''}`,onClick:()=>setView('gap')},
          '⚠ Gap Analysis',
          totalViolations>0&&h('span',{className:'gap-count'},totalViolations)
        )
      ),
      h('div',{className:'hdr-r'},
        data&&h('span',{className:'hdr-meta'},`Analysed ${data.analyzedAt}`),
        h('button',{className:'analyze-btn',onClick:()=>setShowAnalyze(true)},'+ Analyze repo')
      )
    ),

    // Impact bar (only on domain map and ddd views)
    view!=='gap'&&h(ImpactBar,{onSearch:handleImpact,counts,loading:impactLoading}),

    // Main layout
    data&&h('div',{className:'layout'},
      // Sidebar hidden on gap view
      view!=='gap'&&h(Sidebar,{
        domains:data.domains,
        selected:view==='ddd'?selAgg:selDomain,
        onSelect:view==='ddd'
          ?agg=>{setSelAgg(agg);if(agg)setTimeout(()=>{const el=document.getElementById('agg-'+agg);if(el)el.scrollIntoView({behavior:'smooth',block:'start'});},50);}
          :id=>{setSelDomain(id);setSelWf(null);},
        impact,view
      }),

      h('main',{className:'content'},
        // Domain Map view
        view==='current'&&h('div',null,
          selectedDomain&&h(DomainDetail,{domain:selectedDomain,impact,onClose:()=>setSelDomain(null)}),
          h('div',{className:'sec-title'},selDomain?`${selectedDomain?.name} — Domains`:'All Domains'),
          // Domain cards with violation badges
          h('div',{className:'domain-grid'},
            (selDomain?data.domains.filter(d=>d.id===selDomain):data.domains).map(d=>{
              const score=impact?.domainScores[d.id];
              const lvl=score?.level??'none';
              const reason=score?.reason||'';
              const vio=domainViolations[d.id]||( d.health==='anemic'?'P1':null);
              const cls=['dc',impact?`d-${lvl}`:'',selDomain===d.id?'selected':''].filter(Boolean).join(' ');
              if(editingId===d.id) return h(DomainCardInlineEdit,{key:d.id,domain:d,
                onSave:async patch=>{
                  const r=await fetch(`${API}/api/services/${activeSvc}/domains/${patch.id}`,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify(patch)});
                  if(r.ok){setData(await r.json());showToast(`✅ "${patch.name}" saved`);}
                  else showToast('❌ Failed to save','danger');
                  setEditingId(null);
                },
                onDelete:async domainId=>{
                  const name=data.domains.find(x=>x.id===domainId)?.name||domainId;
                  const r=await fetch(`${API}/api/services/${activeSvc}/domains/${domainId}`,{method:'DELETE'});
                  if(r.ok){setData(await r.json());showToast(`🗑 "${name}" removed`,'danger');}
                  else showToast('❌ Failed to remove','danger');
                  setEditingId(null);
                },
                onCancel:()=>setEditingId(null)
              });
              return h('div',{key:d.id,className:cls,onClick:()=>{setEditingId(null);setSelDomain(d.id===selDomain?null:d.id);}},
                h('div',{className:'dc-hdr'},
                  h('span',{className:'dc-icon'},d.icon),
                  h('span',{className:'dc-name'},d.name),
                  impact&&lvl!=='none'&&h('span',{className:`dc-ibadge ${lvl}`},lvl==='direct'?'🔴 Direct':'🟡 Indirect'),
                  vio&&!impact&&h('span',{className:`vio-badge ${vio}`},vio),
                  h('button',{className:'dc-edit-btn',onClick:e=>{e.stopPropagation();setEditingId(d.id);}},'Edit')
                ),
                h('div',{className:'dc-health'},HEALTH_LABEL[d.health]),
                impact&&lvl!=='none'&&reason&&h('div',{style:{fontSize:10,color:lvl==='direct'?'#C62828':'#7A5000',marginBottom:4,lineHeight:1.4,fontStyle:'italic'}},reason),
                h('ul',{className:'dc-ops'},
                  d.operations.slice(0,3).map(op=>h('li',{key:op,className:(score?.matchedOps||[]).includes(op)?'op-hit':''},op)),
                  d.operations.length>3&&h('li',{key:'more',className:'op-more'},`+${d.operations.length-3} more`)
                )
              );
            }),
            h('button',{key:'__add',className:'dc dc-add',onClick:e=>{e.stopPropagation();setEditDomain(null);setIsNewDomain(true);}},
              h('span',{className:'dc-add-icon'},'＋'),
              h('span',{className:'dc-add-lbl'},'Add Domain')
            )
          ),
          h('div',{className:'sec-title',style:{marginTop:28}},selDomain?`${selectedDomain?.name} — Workflows`:'Key Workflows'),
          h(WorkflowPanel,{workflows:data.workflows,impact:impact?{...impact,workflowImpacts:impact.workflowImpacts}:null,selected:selWf,onSelect:setSelWf,filterDomainId:selDomain}),
          !selDomain&&h('div',null,
            h('div',{className:'sec-title',style:{marginTop:28}},'External Integrations'),
            h('div',{className:'int-grid'},
              [{t:'Kafka — IN',items:data.integrations.kafkaIn,c:'ki'},{t:'Kafka — OUT',items:data.integrations.kafkaOut,c:'ko'},{t:'HTTP Services',items:data.integrations.http,c:'htt'},{t:'Background',items:data.integrations.background,c:'bg2'}]
              .map(g=>h('div',{key:g.t,className:`int-card ${g.c}`},h('h4',null,g.t),h('ul',null,g.items.map(i=>h('li',{key:i},i)))))
            )
          )
        ),

        // DDD Target view — shows output of domain-boundary-context-generation
        view==='ddd'&&h('div',null,
          // Toolbar
          h('div',{className:'ddd-toolbar'},
            h('div',{className:'sec-title',style:{margin:0}},
              selAgg?`${selAgg} — Confirmed Aggregate Model`:'Confirmed Domain Model'
            ),
            h('button',{
              className:`ctx-map-btn${ctxMapStatus==='ready'?' active':''}`,
              disabled:ctxMapStatus==='generating',
              onClick:ctxMapStatus==='generating'?null:()=>{
                setCtxMapStatus('generating');
                setTimeout(()=>setCtxMapStatus('ready'),1300);
              }
            },
              ctxMapStatus==='idle'?'🗺️ Generate Context Diagram':
              ctxMapStatus==='generating'?'⟳ Analyzing…':
              '↻ Regenerate'
            )
          ),
          // Mining summary strip (domain-mining output)
          (()=>{
            const all=data.domains;
            const good=all.filter(d=>d.health==='good').length;
            const partial=all.filter(d=>d.health==='partial').length;
            const anemic=all.filter(d=>d.health==='anemic').length;
            const ctxCount=groupByContext(all,editedTargets).length;
            return h('div',{className:'mining-summary'},
              h('span',{className:'ms-stat'},h('strong',null,all.length),'domains analysed'),
              h('span',{className:'ms-divider'},'·'),
              h('span',{className:'ms-stat'},h('strong',null,good),'✅ Rich'),
              h('span',{className:'ms-stat'},h('strong',null,partial),'🟡 Partial'),
              h('span',{className:'ms-stat'},h('strong',null,anemic),'🔴 Anemic'),
              h('span',{className:'ms-divider'},'·'),
              h('span',{className:'ms-stat'},h('strong',null,ctxCount),'bounded contexts detected')
            );
          })(),
          // Bounded context sections (confirmed bounded context output)
          (()=>{
            const sourceDomains=selAgg
              ?data.domains.filter(d=>{const t=editedTargets[d.id]||d.dddTarget;return t?.aggregate===selAgg;})
              :data.domains;
            if(selAgg){
              // Single aggregate filtered — skip grouping
              return h(EditableAggregateCards,{
                domains:sourceDomains,impact,editedTargets,
                onEdit:(id,t)=>setEditedTargets(prev=>({...prev,[id]:t}))
              });
            }
            const groups=groupByContext(sourceDomains,editedTargets);
            return h('div',null,
              groups.map(g=>h('div',{key:g.name,className:'ctx-section'},
                h('div',{
                  className:'ctx-section-hdr',
                  style:{color:g.border,background:g.bg}
                },
                  h('span',{className:'ctx-name'},g.name),
                  h('span',{className:'ctx-count'},`${g.domains.length} aggregate${g.domains.length===1?'':'s'}`)
                ),
                h(EditableAggregateCards,{
                  domains:g.domains,impact,editedTargets,
                  onEdit:(id,t)=>setEditedTargets(prev=>({...prev,[id]:t})),
                  onAdd:()=>setIsNewDddDomain({bucketName:g.name,border:g.border,bg:g.bg}),
                  addColor:g.border
                })
              ))
            );
          })(),
          // Context diagram (spinner → SVG)
          ctxMapStatus==='generating'&&h('div',{className:'ctx-map-section'},
            h('div',{style:{display:'flex',alignItems:'center',gap:14,padding:'36px 0',justifyContent:'center',color:'#7c3aed',fontSize:13}},
              h('div',{className:'spinner',style:{borderTopColor:'#7c3aed',width:20,height:20,borderWidth:2}}),
              h('span',null,'Analyzing inter-aggregate relationships…')
            )
          ),
          ctxMapStatus==='ready'&&h('div',{className:'ctx-map-section'},
            h('div',{className:'ctx-map-hdr'},
              h('div',{className:'sec-title',style:{margin:0}},'Bounded Context Diagram'),
              h('span',{style:{fontSize:11,color:'#9AA7B4'}},'— reflects saved edits · run relationship-analysis skill for verified arrows')
            ),
            h(ContextMapSvg,{data:{...data,domains:data.domains.map(d=>({...d,dddTarget:editedTargets[d.id]||d.dddTarget}))},editedTargets}),
            data.boundedContext&&h('div',{style:{marginTop:20}},
              h('div',{className:'sec-title'},'Service Integration Contracts'),
              h('div',{style:{fontSize:11,color:'#9AA7B4',marginBottom:10,marginTop:-6}},
                'What this service owns, its external dependencies, and the events it publishes/consumes'
              ),
              h(BoundedContextPanel,{bc:data.boundedContext})
            )
          )
        ),

        // Gap Analysis view
        view==='gap'&&h('div',null,
          h('div',{className:'sec-title'},'DDD Gap Analysis — content-manager-service'),
          h(GapAnalysis,{gaps,workflows:data.workflows})
        )
      )
    ),

    // Analyze panel modal
    showAnalyze&&h(AnalyzePanel,{onClose:()=>setShowAnalyze(false),onDone:handleAnalyzeDone}),
    // Domain edit/add modal
    isNewDomain&&h(DomainEditModal,{domain:null,isNew:true,onSave:handleSaveDomain,onClose:()=>{setEditDomain(null);setIsNewDomain(false);}}),
    // DDD Target add modal
    isNewDddDomain&&h(DddDomainAddModal,{bucket:isNewDddDomain,onSave:handleSaveDddDomain,onClose:()=>setIsNewDddDomain(null)}),

    // Toasts
    toasts.length>0&&h('div',{className:'toast-wrap'},
      toasts.map(t=>h('div',{key:t.id,className:`toast toast-${t.type}`},t.msg))
    )
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(App));
</script>
</body>
</html>
